// joy 的 Android APK 打包配置。
//
// .github/workflows/android.yml 会把它复制到 build-apk/app/build.gradle，覆盖
// SDL/android-project 自带的那份。区别在于：
//   - SDL 默认工程会用 externalNativeBuild 再跑一遍 ndk-build/CMake 重编 SDL；
//     而 joy 的 native 部分已由仓库根的 CMake + NDK 交叉编译完成。
//   - SDLActivity 只会 dlopen 一个 libmain.so 并找 SDL_main，没法在一个 APK
//     里塞四个入口。所以四个后端各打一个 APK：4 个 productFlavor，
//     一次 assembleDebug 全出，每个 flavor 用自己的
//     src/<backend>/jniLibs 与 src/<backend>/assets。
//   - 只做「预编译产物 -> jniLibs / assets -> APK」，不再编 native。
// Java 层（SDLActivity.getLibraries() 会依次加载 SDL3 / main）、res/ 和
// AndroidManifest.xml 仍然直接复用 SDL/android-project/app 里的文件。

apply plugin: 'com.android.application'

android {
    namespace 'org.libsdl.app'
    // 与 .github/workflows/android.yml 装的 SDK、以及 CMake 的
    // -DANDROID_PLATFORM=android-24 保持一致，不额外依赖 android-35。
    compileSdkVersion 34

    defaultConfig {
        applicationId 'org.libsdl.app'
        // native 用 android-24 交叉编译；API 21/22 也不支持从 APK 直接加载
        // 未抽取的 .so，minSdk 与编译平台对齐最稳。
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 1
        versionName '1.0'
    }

    // 一个后端一个 APK：applicationIdSuffix 让四个包能同时装在一台设备上。
    flavorDimensions += 'backend'
    productFlavors {
        cpp {
            dimension 'backend'
            applicationIdSuffix '.cpp'
        }
        lua {
            dimension 'backend'
            applicationIdSuffix '.lua'
        }
        js {
            dimension 'backend'
            applicationIdSuffix '.js'
        }
        csharp {
            dimension 'backend'
            applicationIdSuffix '.cs'
        }
    }

    sourceSets {
        // SDL 工程的 src/main 里只有 Java/res/Manifest；清空默认的
        // jniLibs/assets，避免以后上游带进无关资源混进每个 flavor。
        main {
            jniLibs.srcDirs = []
            assets.srcDirs = []
        }
        cpp {
            jniLibs.srcDirs = ['src/cpp/jniLibs']
            assets.srcDirs = ['src/cpp/assets']
        }
        lua {
            jniLibs.srcDirs = ['src/lua/jniLibs']
            assets.srcDirs = ['src/lua/assets']
        }
        js {
            jniLibs.srcDirs = ['src/js/jniLibs']
            assets.srcDirs = ['src/js/assets']
        }
        csharp {
            jniLibs.srcDirs = ['src/csharp/jniLibs']
            assets.srcDirs = ['src/csharp/assets']
        }
    }

    // 预编译产物按原样进 APK：不让 AGP 用本机（可能不同版本的）NDK strip，
    // 也不需要为打包这一步再配置 ndkVersion。产物名由 workflow 复制时统一。
    packagingOptions {
        doNotStrip '**/*.so'
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
