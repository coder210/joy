name: Android APKs (cpp / lua / js / csharp)

# 本机没有 NDK，Android 产物的交叉编译与校验全部放在 CI 上做。
# MonoVM 运行时与平台 BCL 已入库（runtimes/android-arm64/），CI 不再联网下载。
# 流程：CMake/NDK 串行交叉编译四个后端 -> 各自的 libmain.so + 共享的
#       libSDL3.so / libmonosgen-2.0.so / pack 资源根
#       -> 复用 SDL/android-project 的 Gradle 工程（Java/res/Manifest/wrapper），
#          配合 android/app.build.gradle 的 4 个 productFlavor 只做预编译产物打包
#       -> 一次 assembleDebug 出 4 个 APK。
# SDLActivity 只会 dlopen 一个 libmain.so 并 dlsym("SDL_main")，一个 APK 只能有
# 一个入口，所以四个后端各打一个包（不是 4 个 workflow、也不是 4 个 job）。
# artifact 只放最终 APK，中间产物留在构建目录里供失败排查。
# 可用 workflow_dispatch 手动触发，产物从 Artifacts 下载。
#
# SDK 用 ubuntu-24.04 镜像预装的 Android SDK，不再依赖第三方 setup-android action：
# 该 action（Node 20）在 ubuntu-latest 迁移到 Ubuntu 26 后被强制跑在 Node 24 下，
# 曾在 Setup Android SDK 步骤直接失败，导致编译从未开始。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  android-arm64:
    name: Android / arm64-v8a / 4 APKs
    runs-on: ubuntu-24.04
    env:
      CLR_VERSION: 8.0.17
      ANDROID_ABI: arm64-v8a
      ANDROID_PLATFORM: android-24
      NDK_VERSION: 26.3.11579264
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # JoyGame.csproj / Joy.Bindings.csproj 是 netstandard2.0，构建期需要 dotnet。
      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # sdkmanager 需要 JDK 17；与 joy_topdown_template/android-build.yml 保持一致。
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 镜像自带 $ANDROID_HOME 与 cmdline-tools，直接装固定 NDK；
      # 装完校验 toolchain 文件，避免后面 configure 报一个离题的 CMake 错。
      - name: Install fixed NDK (preinstalled SDK)
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$sdk" || { echo "::error::Android SDK not found at $sdk"; exit 1; }
          sdkmanager_bin="$sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager_bin" ]; then
            sdkmanager_bin="$(command -v sdkmanager || true)"
          fi
          test -n "$sdkmanager_bin" || { echo "::error::sdkmanager not found"; exit 1; }
          yes | "$sdkmanager_bin" --licenses >/dev/null 2>&1 || true
          # android/app.build.gradle 的 compileSdk 34 + build-tools 34.0.0
          # 与 CMake 的 ANDROID_PLATFORM 对齐；显式装齐避免 Gradle 联网重试。
          "$sdkmanager_bin" --install "platforms;android-34" \
            "build-tools;34.0.0" "ndk;${NDK_VERSION}" >/dev/null
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$sdk/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          test -f "$sdk/ndk/${NDK_VERSION}/build/cmake/android.toolchain.cmake" \
            || { echo "::error::NDK toolchain file missing"; exit 1; }

      # 运行时与平台 BCL 已随仓库入库（见 runtimes/README.md），CI 只做防呆校验，
      # 不再联网下载，clone 后即可 configure。
      - name: Verify vendored MonoVM runtime
        shell: bash
        run: |
          set -euo pipefail
          dst=runtimes/android-arm64
          for f in libmonosgen-2.0.so libs/System.Private.CoreLib.dll \
                   libs/netstandard.dll libs/System.Runtime.dll libs/System.Collections.dll \
                   libSystem.Native.so libSystem.Globalization.Native.so \
                   libSystem.IO.Compression.Native.so \
                   libSystem.Security.Cryptography.Native.Android.so; do
            test -s "$dst/$f" || { echo "missing vendored runtime: $f"; exit 1; }
          done
          file "$dst/libmonosgen-2.0.so" | grep -Eqi 'aarch64|arm64'
          grep -aq "${CLR_VERSION}" "$dst/libmonosgen-2.0.so" || { echo "CLR version mismatch"; exit 1; }
          # 本机已解析 dynsym 核实过 1312 个 mono_*；CI 只查 jcsx.c 依赖的 8 个
          for sym in mono_jit_init mono_image_open_from_data mono_assembly_load_from_full \
                     mono_runtime_invoke mono_add_internal_call mono_set_dirs \
                     mono_set_assemblies_path mono_free; do
            grep -aq "$sym" "$dst/libmonosgen-2.0.so" || { echo "missing export: $sym"; exit 1; }
          done

      - name: Configure (Android toolchain)
        shell: bash
        run: |
          set -euo pipefail
          cmake -S examples -B build-android -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="$ANDROID_ABI" \
            -DANDROID_PLATFORM="$ANDROID_PLATFORM" 2>&1 | tee configure-android.log

      - name: Build four backends (libmain.so each)
        shell: bash
        run: |
          set -euo pipefail
          # 四个 target 的 POST_BUILD 都写同一个 pack/ 资源根，并行会互相踩
          # （csharp 还会 remove_directory pack/lib）。串行构建，单 target 内部并行。
          for target in example_cpp example_lua example_js example_csharp; do
            echo "--- building $target ---"
            cmake --build build-android --target "$target" --parallel \
              2>&1 | tee -a build-android.log
          done

      - name: Verify outputs
        shell: bash
        run: |
          set -euo pipefail
          test -f "build-android/lib/$ANDROID_ABI/libmonosgen-2.0.so"
          test -f "build-android/lib/$ANDROID_ABI/libJoyGameCpp.so"
          # Android 版 CoreLib 的 P/Invoke 目标被拆成独立 shim，少一个都会让
          # MonoVM 启动时 dlopen 失败闪退。
          for f in libSystem.Native.so libSystem.Globalization.Native.so \
                   libSystem.IO.Compression.Native.so \
                   libSystem.Security.Cryptography.Native.Android.so; do
            test -f "build-android/lib/$ANDROID_ABI/$f" \
              || { echo "::error::missing CoreLib shim: $f"; exit 1; }
          done
          # 四个后端的 libmain.so 落在各自的构建子目录，互不覆盖；
          # SDLActivity 靠 dlsym("SDL_main") 启动，符号必须导出。
          for so in build-android/cpp/libmain.so build-android/lua/libmain.so \
                    build-android/js/libmain.so build-android/csharp_host/libmain.so; do
            test -f "$so" || { echo "::error::missing $so"; exit 1; }
            grep -aq 'SDL_main' "$so" || { echo "::error::$so 未导出 SDL_main"; exit 1; }
          done
          test -f build-android/pack/JoyGame.dll
          test -f build-android/pack/lib/System.Private.CoreLib.dll
          test -f build-android/pack/scripts/main.lua
          test -f build-android/pack/scripts/main.js
          echo "--- 关键产物 ---"
          find build-android -maxdepth 3 \( -name 'libmain.so' -o -name 'libSDL3.so' \) -print | sort

      - name: Assemble 4 APKs (flavored prebuilt libs + assets)
        shell: bash
        run: |
          set -euo pipefail
          # 复用 SDL 的 Gradle 工程骨架（SDLActivity/Java、res、Manifest、wrapper），
          # 但覆盖 app/build.gradle：native 已交叉编译好，绝不跑 externalNativeBuild。
          rm -rf build-apk
          mkdir -p build-apk
          cp -a SDL/android-project/. build-apk/
          cp android/app.build.gradle build-apk/app/build.gradle

          sdl3="$(find build-android -name 'libSDL3.so' -type f -print -quit)"
          mono="build-android/lib/$ANDROID_ABI/libmonosgen-2.0.so"
          cpp_game="build-android/lib/$ANDROID_ABI/libJoyGameCpp.so"
          test -n "$sdl3" || { echo "::error::libSDL3.so missing from cross-build"; exit 1; }
          # joy::all 含 cs 模块，四个后端的导入表都带 mono_*，主库每个 APK 都要有。
          test -f "$mono" || { echo "::error::libmonosgen-2.0.so missing"; exit 1; }

          # 若任一 libmain.so 依赖 NDK 的 C++ 运行时，系统不提供，必须一起打进 APK。
          stl=""
          for so in build-android/cpp/libmain.so build-android/lua/libmain.so \
                    build-android/js/libmain.so build-android/csharp_host/libmain.so; do
            if grep -aq 'libc++_shared.so' "$so"; then
              stl="$(find "$ANDROID_NDK_HOME" -path '*/sysroot/usr/lib/*/libc++_shared.so' -print -quit)"
              test -n "$stl" || { echo "::error::libc++_shared.so not found in NDK"; exit 1; }
              break
            fi
          done

          pack=build-android/pack
          for backend in cpp lua js csharp; do
            jni="build-apk/app/src/$backend/jniLibs/$ANDROID_ABI"
            assets="build-apk/app/src/$backend/assets"
            mkdir -p "$jni" "$assets"

            # SDLActivity.getLibraries() 依次 System.loadLibrary("SDL3", "main")。
            cp "$sdl3" "$jni/libSDL3.so"
            cp "$mono" "$jni/libmonosgen-2.0.so"
            [ -z "$stl" ] || cp "$stl" "$jni/libc++_shared.so"
            case "$backend" in
              cpp)
                cp build-android/cpp/libmain.so "$jni/libmain.so"
                # C++ 宿主用裸库名让 linker 从 lib/<abi>/ 找游戏库。
                cp "$cpp_game" "$jni/libJoyGameCpp.so" ;;
              lua)    cp build-android/lua/libmain.so "$jni/libmain.so" ;;
              js)     cp build-android/js/libmain.so "$jni/libmain.so" ;;
              csharp) cp build-android/csharp_host/libmain.so "$jni/libmain.so"
                      # CoreLib 的 P/Invoke shim 按 SONAME dlopen，必须和
                      # libmain.so 一起落在 lib/<abi>/；其它后端不初始化 CLR，
                      # 不必多带这 1 MB。
                      for f in libSystem.Native.so libSystem.Globalization.Native.so \
                               libSystem.IO.Compression.Native.so \
                               libSystem.Security.Cryptography.Native.Android.so; do
                        cp "build-android/lib/$ANDROID_ABI/$f" "$jni/"
                      done ;;
            esac

            # 四份示例共用的图片/字体；脚本与 C# 程序集只给对应后端，
            # 避免每个 APK 都塞一份用不到的 BCL / 另一套脚本。
            cp -a "$pack/fonts" "$pack/sprites" "$assets"/
            case "$backend" in
              lua)    mkdir -p "$assets/scripts"
                      cp "$pack/scripts/main.lua" "$assets/scripts/" ;;
              js)     mkdir -p "$assets/scripts"
                      cp "$pack/scripts/main.js" "$assets/scripts/" ;;
              csharp) cp "$pack/JoyGame.dll" "$assets/"
                      cp -a "$pack/lib" "$assets/" ;;
              cpp)    : ;;
            esac

            test -f "$jni/libmain.so" || { echo "::error::$backend 缺 libmain.so"; exit 1; }
            # 资源根不能有 assets/ 前缀层，否则 AAssetManager 读不到。
            test ! -d "$assets/assets" \
              || { echo "::error::$backend 出现嵌套 assets/ 目录"; exit 1; }
          done

          echo "--- jniLibs / assets ---"
          find build-apk/app/src -type f | sort

          cd build-apk
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tee ../gradle-apk.log
          cd ..

          for backend in cpp lua js csharp; do
            apk="$(find "build-apk/app/build/outputs/apk/$backend" -name '*.apk' -type f -print -quit)"
            test -n "$apk" || { echo "::error::$backend 没有产出 APK"; exit 1; }
            cp "$apk" "joy-example-$backend-${ANDROID_ABI}-debug.apk"
          done

          # C# 包必须同时带齐 native shim 与 assets 里的 BCL / 程序集，
          # 少一样都会表现为启动闪退；在 CI 里直接查 APK 清单防回归。
          unzip -Z1 "joy-example-csharp-${ANDROID_ABI}-debug.apk" > /tmp/csharp-apk.txt
          for f in libSystem.Native.so libSystem.Globalization.Native.so \
                   libSystem.IO.Compression.Native.so \
                   libSystem.Security.Cryptography.Native.Android.so; do
            grep -qx "lib/$ANDROID_ABI/$f" /tmp/csharp-apk.txt \
              || { echo "::error::csharp APK 缺 $f"; exit 1; }
          done
          grep -qx "assets/JoyGame.dll" /tmp/csharp-apk.txt \
            || { echo "::error::csharp APK 缺 assets/JoyGame.dll"; exit 1; }
          grep -qx "assets/lib/System.Private.CoreLib.dll" /tmp/csharp-apk.txt \
            || { echo "::error::csharp APK 缺 assets/lib/System.Private.CoreLib.dll"; exit 1; }
          ls -lh joy-example-*-debug.apk

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: joy-android-${{ env.ANDROID_ABI }}
          # 只给最终可安装的包；libmain.so / pack/ 等中间产物不再混进 artifact。
          path: joy-example-*-${{ env.ANDROID_ABI }}-debug.apk
          if-no-files-found: error
          retention-days: 14

      # 公开仓库匿名读不到 job 日志 / artifact；把编译错误行转成 annotation，
      # 失败原因可以直接从 check-run annotations 读到，不必登录 GitHub 翻日志。
      - name: Surface build errors
        if: failure()
        shell: bash
        run: |
          set -uo pipefail
          logs=(configure-android.log build-android.log gradle-apk.log)
          present=()
          for f in "${logs[@]}"; do
            [ -f "$f" ] && present+=("$f")
          done
          if [ ${#present[@]} -eq 0 ]; then exit 0; fi
          {
            (grep -nE 'error:|fatal error:|undefined reference|ninja: build stopped|CMake Error|FAILURE:|What went wrong|Could not resolve|SDK location not found|Error [0-9]+' "${present[@]}" || true) | head -30
            tail -n 12 <(cat "${present[@]}")
          } > /tmp/joy-errors.txt
          while IFS= read -r line; do
            line="${line//%/%25}"
            line="${line//$'\r'/%0D}"
            echo "::error::$line"
          done < /tmp/joy-errors.txt

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: joy-android-logs-${{ env.ANDROID_ABI }}
          path: |
            configure-android.log
            build-android.log
            gradle-apk.log
            build-android/CMakeFiles/CMake*.log
          if-no-files-found: warn
          retention-days: 7
