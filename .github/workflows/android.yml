name: Android APK (C# host)

# 本机没有 NDK，Android 产物的交叉编译与校验全部放在 CI 上做。
# MonoVM 运行时与平台 BCL 已入库（runtimes/android-arm64/），CI 不再联网下载。
# 流程：CMake/NDK 交叉编译 -> libmain.so / libSDL3.so / libmonosgen-2.0.so
#       -> 复用 SDL/android-project 的 Gradle 工程（Java/res/Manifest/wrapper），
#          配合 android/app.build.gradle 只做预编译产物打包，不重编 native
#       -> assembleDebug 产出 APK，与中间产物一起放进同一个 artifact。
# 可用 workflow_dispatch 手动触发，产物从 Artifacts 下载。
#
# SDK 用 ubuntu-24.04 镜像预装的 Android SDK，不再依赖第三方 setup-android action：
# 该 action（Node 20）在 ubuntu-latest 迁移到 Ubuntu 26 后被强制跑在 Node 24 下，
# 曾在 Setup Android SDK 步骤直接失败，导致编译从未开始。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  android-arm64:
    name: Android / arm64-v8a / APK
    runs-on: ubuntu-24.04
    env:
      CLR_VERSION: 8.0.17
      ANDROID_ABI: arm64-v8a
      ANDROID_PLATFORM: android-24
      NDK_VERSION: 26.3.11579264
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # JoyGame.csproj / Joy.Bindings.csproj 是 netstandard2.0，构建期需要 dotnet。
      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # sdkmanager 需要 JDK 17；与 joy_topdown_template/android-build.yml 保持一致。
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 镜像自带 $ANDROID_HOME 与 cmdline-tools，直接装固定 NDK；
      # 装完校验 toolchain 文件，避免后面 configure 报一个离题的 CMake 错。
      - name: Install fixed NDK (preinstalled SDK)
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$sdk" || { echo "::error::Android SDK not found at $sdk"; exit 1; }
          sdkmanager_bin="$sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager_bin" ]; then
            sdkmanager_bin="$(command -v sdkmanager || true)"
          fi
          test -n "$sdkmanager_bin" || { echo "::error::sdkmanager not found"; exit 1; }
          yes | "$sdkmanager_bin" --licenses >/dev/null 2>&1 || true
          # android/app.build.gradle 的 compileSdk 34 + build-tools 34.0.0
          # 与 CMake 的 ANDROID_PLATFORM 对齐；显式装齐避免 Gradle 联网重试。
          "$sdkmanager_bin" --install "platforms;android-34" \
            "build-tools;34.0.0" "ndk;${NDK_VERSION}" >/dev/null
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$sdk/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          test -f "$sdk/ndk/${NDK_VERSION}/build/cmake/android.toolchain.cmake" \
            || { echo "::error::NDK toolchain file missing"; exit 1; }

      # 运行时与平台 BCL 已随仓库入库（见 runtimes/README.md），CI 只做防呆校验，
      # 不再联网下载，clone 后即可 configure。
      - name: Verify vendored MonoVM runtime
        shell: bash
        run: |
          set -euo pipefail
          dst=runtimes/android-arm64
          for f in libmonosgen-2.0.so libs/System.Private.CoreLib.dll \
                   libs/netstandard.dll libs/System.Runtime.dll libs/System.Collections.dll; do
            test -s "$dst/$f" || { echo "missing vendored runtime: $f"; exit 1; }
          done
          file "$dst/libmonosgen-2.0.so" | grep -Eqi 'aarch64|arm64'
          grep -aq "${CLR_VERSION}" "$dst/libmonosgen-2.0.so" || { echo "CLR version mismatch"; exit 1; }
          # 本机已解析 dynsym 核实过 1312 个 mono_*；CI 只查 jcsx.c 依赖的 7 个
          for sym in mono_jit_init mono_image_open_from_data mono_assembly_load_from_full \
                     mono_runtime_invoke mono_add_internal_call mono_set_dirs mono_free; do
            grep -aq "$sym" "$dst/libmonosgen-2.0.so" || { echo "missing export: $sym"; exit 1; }
          done

      - name: Configure (Android toolchain)
        shell: bash
        run: |
          set -euo pipefail
          cmake -S examples -B build-android -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="$ANDROID_ABI" \
            -DANDROID_PLATFORM="$ANDROID_PLATFORM" 2>&1 | tee configure-android.log

      - name: Build C# host (libmain.so)
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build-android --target example_csharp --parallel \
            2>&1 | tee build-android.log

      - name: Verify outputs
        shell: bash
        run: |
          set -euo pipefail
          test -f "build-android/lib/$ANDROID_ABI/libmonosgen-2.0.so"
          find build-android -name libmain.so -print | tee /tmp/libmain.txt
          test -s /tmp/libmain.txt
          find build-android/pack -path '*/lib/System.Private.CoreLib.dll' -print | tee /tmp/bcl.txt
          test -s /tmp/bcl.txt
          echo "--- 关键产物 ---"
          find build-android \( -name 'libmain.so' -o -path '*/pack/JoyGame.dll' \) -print | sort

      - name: Assemble APK (prebuilt native libs + assets)
        shell: bash
        run: |
          set -euo pipefail
          # 复用 SDL 的 Gradle 工程骨架（SDLActivity/Java、res、Manifest、wrapper），
          # 但覆盖 app/build.gradle：native 已交叉编译好，绝不再跑 externalNativeBuild。
          rm -rf build-apk
          mkdir -p build-apk
          cp -a SDL/android-project/. build-apk/
          cp android/app.build.gradle build-apk/app/build.gradle

          jni="build-apk/app/src/main/jniLibs/$ANDROID_ABI"
          assets="build-apk/app/src/main/assets"
          mkdir -p "$jni" "$assets"

          # libmain.so 的 DT_NEEDED 含 libSDL3.so / libmonosgen-2.0.so；
          # SDLActivity.getLibraries() 还会 System.loadLibrary("SDL3")，三者缺一不可。
          sdl3="$(find build-android -name 'libSDL3.so' -type f -print -quit)"
          main_so="$(find build-android -name 'libmain.so' -type f -print -quit)"
          test -n "$sdl3" || { echo "::error::libSDL3.so missing from cross-build"; exit 1; }
          test -n "$main_so" || { echo "::error::libmain.so missing from cross-build"; exit 1; }
          cp "$sdl3" "$jni/libSDL3.so"
          cp "$main_so" "$jni/libmain.so"
          cp "build-android/lib/$ANDROID_ABI/libmonosgen-2.0.so" "$jni/"

          # 若任一 .so 依赖 NDK 的 C++ 运行时，系统不提供，必须一起打进 APK。
          for so in "$jni"/*.so; do
            if grep -aq 'libc++_shared.so' "$so"; then
              stl="$(find "$ANDROID_NDK_HOME" -path '*/sysroot/usr/lib/*/libc++_shared.so' -print -quit)"
              test -n "$stl" || { echo "::error::libc++_shared.so not found in NDK"; exit 1; }
              cp "$stl" "$jni/libc++_shared.so"
              break
            fi
          done

          # 运行期资源根（无 assets/ 前缀）：CMake 的 JOY_EXAMPLE_ASSET_ROOT 在
          # Android 下就是 build-android/pack，内容原样成为 APK 的 assets 根。
          # 宿主用 utils_read_file -> SDL_LoadFile 从 APK assets 读，BCL 首次
          # 启动再解到 SDL_GetPrefPath。
          assets_src="build-android/pack"
          test -f "$assets_src/JoyGame.dll" \
            || { echo "::error::JoyGame.dll not found in $assets_src"; exit 1; }
          test -f "$assets_src/lib/System.Private.CoreLib.dll" \
            || { echo "::error::BCL not found in $assets_src/lib"; exit 1; }
          cp -a "$assets_src"/. "$assets"/
          # 防回归：APK assets 根下不能再出现 assets/ 子目录，否则
          # AAssetManager 会去找 assets/assets/... 而读不到任何资源。
          test ! -d "$assets/assets" \
            || { echo "::error::nested assets/ directory in APK assets root"; exit 1; }
          echo "--- jniLibs / assets ---"
          find "$jni" "$assets" -type f | sort

          cd build-apk
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tee ../gradle-apk.log
          cd ..

          apk="$(find build-apk/app/build/outputs/apk -name '*.apk' -type f -print -quit)"
          test -n "$apk" || { echo "::error::Gradle did not produce an APK"; exit 1; }
          cp "$apk" "joy-example-csharp-${ANDROID_ABI}-debug.apk"
          ls -lh "joy-example-csharp-${ANDROID_ABI}-debug.apk"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: joy-android-${{ env.ANDROID_ABI }}
          path: |
            joy-example-csharp-*.apk
            build-android/**/libmain.so
            build-android/lib/${{ env.ANDROID_ABI }}/*.so
            build-android/pack/**
          if-no-files-found: error
          retention-days: 14

      # 公开仓库匿名读不到 job 日志 / artifact；把编译错误行转成 annotation，
      # 失败原因可以直接从 check-run annotations 读到，不必登录 GitHub 翻日志。
      - name: Surface build errors
        if: failure()
        shell: bash
        run: |
          set -uo pipefail
          logs=(configure-android.log build-android.log gradle-apk.log)
          present=()
          for f in "${logs[@]}"; do
            [ -f "$f" ] && present+=("$f")
          done
          if [ ${#present[@]} -eq 0 ]; then exit 0; fi
          {
            (grep -nE 'error:|fatal error:|undefined reference|ninja: build stopped|CMake Error|FAILURE:|What went wrong|Could not resolve|SDK location not found|Error [0-9]+' "${present[@]}" || true) | head -30
            tail -n 12 <(cat "${present[@]}")
          } > /tmp/joy-errors.txt
          while IFS= read -r line; do
            line="${line//%/%25}"
            line="${line//$'\r'/%0D}"
            echo "::error::$line"
          done < /tmp/joy-errors.txt

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: joy-android-logs-${{ env.ANDROID_ABI }}
          path: |
            configure-android.log
            build-android.log
            gradle-apk.log
            build-android/CMakeFiles/CMake*.log
          if-no-files-found: warn
          retention-days: 7
