name: Web examples (cpp / lua / js)

# 平台矩阵：Web 明确只发 cpp / lua / js（方案 A），C# 留在桌面 / Android。
# C# 后端是 C/C++ 宿主嵌入 MonoVM（mono_jit_init + mono_add_internal_call +
# 动态库 + 真实文件系统里的 BCL）；.NET 8 虽正式支持 browser-wasm，但那是
# SDK 托管的 interpreter 应用（dotnet.js 启动 mono_wasm_load_runtime），
# 宿主模型不兼容，Joy.Bindings 的 InternalCall 绑定也没有注册入口。
#
# 打包按 Android 的「每后端自包含」模型，不是桌面的「共享资源目录」：
# 每个 wasm 模块在链接期用 --preload-file 把资源打进自己的 .data，
# 一个 Pages 站点按子目录承载，不按「平台 × 后端」拆 workflow。
# 只在 push(main) 时自动跑；PR 暂不挂（emsdk 安装较重，wasm 链接还在首次验证
# 阶段）。手动触发保留，deploy 输入可一并发布 Pages。
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: '同时发布到 GitHub Pages'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-web:
    name: Web / wasm / Release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Emscripten
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/emscripten-core/emsdk.git --depth=1
          cd emsdk && ./emsdk install 3.1.64 && ./emsdk activate 3.1.64

      - name: Configure with Emscripten
        shell: bash
        run: |
          set -euo pipefail
          source emsdk/emsdk_env.sh
          # -fno-strict-aliasing: jmsgpack.c / protocol.h 的类型双关在 wasm -O3
          # 下会被 TBAA 优化成乱值（参数与理由同 joy_topdown_template/web-build.yml）。
          # 强制单线程：Pages 无法设置 COOP/COEP，SharedArrayBuffer 不可用。
          emcmake cmake -S examples -B build/web \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL_PTHREADS=OFF \
            -DCMAKE_C_FLAGS="-s USE_PTHREADS=0 -fno-strict-aliasing" \
            -DCMAKE_CXX_FLAGS="-s USE_PTHREADS=0 -s DISABLE_EXCEPTION_CATCHING=0 -fno-strict-aliasing" \
            -DCMAKE_EXE_LINKER_FLAGS="-s ALLOW_MEMORY_GROWTH=1 -s TOTAL_MEMORY=256MB -s STACK_SIZE=5MB -s USE_PTHREADS=0 -s SHARED_MEMORY=0 -s WASM_WORKERS=0 -s PROXY_TO_PTHREAD=0 -s ENVIRONMENT=web" \
            2>&1 | tee configure-web.log

      # 只构建三个有效后端；CMake 在 EMSCRIPTEN 下已跳过 csharp_host。
      - name: Build (cpp / lua / js)
        shell: bash
        run: |
          set -euo pipefail
          source emsdk/emsdk_env.sh
          cmake --build build/web --target example_cpp example_lua example_js \
            2>&1 | tee build-web.log

      - name: Prepare Pages site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/cpp _site/lua _site/js
          for b in cpp lua js; do
            # emcc 生成的 JS 把 .data 名字硬编码成 example_$b.data，所以只有
            # html 能改名，js / wasm / data 必须原名同目录。.data 缺失通常
            # 意味着 CMake 的 --preload-file 没生效，直接在这里挡住。
            for ext in html js wasm data; do
              src="build/web/Release/example_$b.$ext"
              test -s "$src" \
                || { echo "::error::$b 缺 example_$b.$ext（--preload-file 生效了吗？）"; exit 1; }
              cp -L "$src" "_site/$b/"
            done
            mv "_site/$b/example_$b.html" "_site/$b/index.html"
          done
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>joy examples</title>
          <h1>joy examples (Web)</h1>
          <ul>
            <li><a href="cpp/">C++</a></li>
            <li><a href="lua/">Lua</a></li>
            <li><a href="js/">JavaScript</a></li>
          </ul>
          <p>Web 只提供 C++ / Lua / JavaScript 三个后端；C# 后端是桌面 / Android
             上的嵌入 MonoVM 宿主，不在 Web 构建范围内。</p>
          HTML
          find _site -type l -delete
          for b in cpp lua js; do
            test -f "_site/$b/index.html"
            test -s "_site/$b/example_$b.data"
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: joy-examples-web
          path: _site/
          retention-days: 7

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: joy-examples-web-logs
          path: '*.log'
          if-no-files-found: warn
          retention-days: 7

  deploy:
    if: inputs.deploy
    needs: build-web
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: joy-examples-web
